name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  distro-test:
    name: ${{ matrix.name }} / syntax, tests, units
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            family: apt
          - name: Debian 12
            image: debian:12
            family: apt
          - name: Fedora
            image: fedora:latest
            family: dnf
          - name: Arch Linux
            image: archlinux:latest
            family: pacman
    steps:
      - uses: actions/checkout@v4

      - name: Run the aggregate check as root inside ${{ matrix.name }}
        # Root deliberately exercises the runuser/chown branches. These containers provide
        # parser/static coverage only; a booted user manager is qualified separately.
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
          DISTRO_FAMILY: ${{ matrix.family }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --workdir /src \
            --env DISTRO_FAMILY \
            --env LANG=C.UTF-8 \
            --env LC_ALL=C.UTF-8 \
            "$DISTRO_IMAGE" \
            bash -lc '
              set -Eeuo pipefail
              case "$DISTRO_FAMILY" in
                apt)
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update
                  apt-get install -y --no-install-recommends \
                    bash coreutils findutils grep sed gawk procps util-linux systemd jq python3
                  ;;
                dnf)
                  dnf install -y \
                    bash coreutils findutils grep sed gawk procps-ng util-linux systemd jq python3
                  ;;
                pacman)
                  pacman -Syu --noconfirm --needed \
                    bash coreutils findutils grep sed gawk procps-ng util-linux systemd jq python
                  ;;
              esac
              bash --version | head -1
              systemd-analyze --version | head -1
              KEEPALIVE_SKIP_SHELLCHECK=1 ./scripts/dev-check.sh
            '

  non-root-test:
    name: Debian 12 / non-root suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the aggregate check as nobody
        # The distro matrix intentionally remains root-heavy; this lane exercises the
        # real per-user ownership and permission contract instead of root's bypasses.
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --workdir /src \
            --env LANG=C.UTF-8 \
            --env LC_ALL=C.UTF-8 \
            debian:12 \
            bash -lc '
              set -Eeuo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                bash coreutils findutils grep sed gawk procps util-linux jq python3
              runuser -u nobody -- env LANG=C.UTF-8 LC_ALL=C.UTF-8 \
                bash -c "cd /src && KEEPALIVE_SKIP_SHELLCHECK=1 ./scripts/dev-check.sh"
            '

  bash-floor:
    name: ${{ matrix.name }} / suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Bash 5.0 (Alpine)
            image: docker.io/library/bash:5.0
          - name: Bash 5.1 (Alpine)
            image: docker.io/library/bash:5.1
    steps:
      - uses: actions/checkout@v4

      - name: Run the suite with the Bash floor image
        # These official images use Alpine/musl and do not ship systemd; install the
        # GNU/core utilities the suite needs, while dev-check reports the systemd unit
        # stage as skipped. The Debian/Fedora/Arch matrix supplies that static check.
        env:
          BASH_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --workdir /src \
            --env LANG=C.UTF-8 \
            --env LC_ALL=C.UTF-8 \
            "$BASH_IMAGE" \
            sh -ec '
              set -Eeuo pipefail
              apk add --no-cache \
                bash coreutils findutils grep sed gawk procps util-linux jq python3 shadow \
                musl-locales musl-locales-lang
              bash --version | head -1
              KEEPALIVE_SKIP_SHELLCHECK=1 ./scripts/dev-check.sh
            '

  lint:
    name: ShellCheck v0.10.0
    runs-on: ubuntu-latest
    # Blocking as of 1.0.0. Pin the analyzer image so hosted-runner package updates cannot
    # silently change the gate; the codes disabled project-wide remain documented in .shellcheckrc.
    steps:
      - uses: actions/checkout@v4

      - name: Run pinned ShellCheck over every shell file
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/mnt:ro" \
            --workdir /mnt \
            docker.io/koalaman/shellcheck-alpine:v0.10.0 \
            sh -c '
              set -Eeuo pipefail
              shellcheck --version | sed -n "2p"
              find . -path ./.git -prune -o -type f \( -name "*.sh" -o -name keepalive \) -print0 \
                | xargs -0 shellcheck -x
            '
