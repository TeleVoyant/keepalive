name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Syntax, tests, and unit verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record the environment
        run: |
          bash --version | head -1
          python3 --version
          command -v systemd-analyze || echo 'systemd-analyze absent; that stage self-skips'

      - name: Run the aggregate developer check
        # ShellCheck is deliberately excluded here and runs as its own non-blocking job.
        env:
          KEEPALIVE_SKIP_SHELLCHECK: '1'
        run: ./scripts/dev-check.sh

  lint:
    name: ShellCheck (advisory)
    runs-on: ubuntu-latest
    # Non-blocking on purpose: the codebase has never been verified against ShellCheck,
    # so gating on it would fail every build until that debt is paid. Promote this to a
    # required check once the findings are cleared.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck over every shell file
        run: |
          mapfile -d '' -t files < <(
            find . -path ./.git -prune -o -type f \( -name '*.sh' -o -name keepalive \) -print0
          )
          printf 'checking %d files\n' "${#files[@]}"
          shellcheck -x "${files[@]}"
