name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  distro-test:
    name: ${{ matrix.name }} / syntax, tests, units
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            family: apt
          - name: Debian 12
            image: debian:12
            family: apt
          - name: Fedora
            image: fedora:latest
            family: dnf
          - name: Arch Linux
            image: archlinux:latest
            family: pacman
    steps:
      - uses: actions/checkout@v4

      - name: Run the aggregate check as root inside ${{ matrix.name }}
        # Root deliberately exercises the runuser/chown branches. These containers provide
        # parser/static coverage only; a booted user manager is qualified separately.
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
          DISTRO_FAMILY: ${{ matrix.family }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --workdir /src \
            --env DISTRO_FAMILY \
            --env LANG=C.UTF-8 \
            --env LC_ALL=C.UTF-8 \
            "$DISTRO_IMAGE" \
            bash -lc '
              set -Eeuo pipefail
              case "$DISTRO_FAMILY" in
                apt)
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update
                  apt-get install -y --no-install-recommends \
                    bash coreutils findutils grep sed gawk procps util-linux systemd jq python3
                  ;;
                dnf)
                  dnf install -y \
                    bash coreutils findutils grep sed gawk procps-ng util-linux systemd jq python3
                  ;;
                pacman)
                  pacman -Syu --noconfirm --needed \
                    bash coreutils findutils grep sed gawk procps-ng util-linux systemd jq python
                  ;;
              esac
              bash --version | head -1
              systemd-analyze --version | head -1
              KEEPALIVE_SKIP_SHELLCHECK=1 ./scripts/dev-check.sh
            '

  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    # Blocking as of 1.0.0. The findings were cleared, and the codes that remain disabled
    # are listed with their justification in .shellcheckrc - one of them, SC2004, would
    # actively corrupt associative-array lookups if followed.
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck over every shell file
        run: |
          mapfile -d '' -t files < <(
            find . -path ./.git -prune -o -type f \( -name '*.sh' -o -name keepalive \) -print0
          )
          shellcheck --version | sed -n '2p'
          printf 'checking %d files\n' "${#files[@]}"
          shellcheck -x "${files[@]}"
