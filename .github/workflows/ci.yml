name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Syntax, tests, and unit verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record the environment
        run: |
          bash --version | head -1
          python3 --version
          command -v systemd-analyze || echo 'systemd-analyze absent; that stage self-skips'

      - name: Run the aggregate developer check
        # ShellCheck runs as its own job below, so it is skipped here to keep the two
        # failures distinguishable in the job list.
        env:
          KEEPALIVE_SKIP_SHELLCHECK: '1'
        run: ./scripts/dev-check.sh

  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    # Blocking as of 1.0.0. The findings were cleared, and the codes that remain disabled
    # are listed with their justification in .shellcheckrc - one of them, SC2004, would
    # actively corrupt associative-array lookups if followed.
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck over every shell file
        run: |
          mapfile -d '' -t files < <(
            find . -path ./.git -prune -o -type f \( -name '*.sh' -o -name keepalive \) -print0
          )
          shellcheck --version | sed -n '2p'
          printf 'checking %d files\n' "${#files[@]}"
          shellcheck -x "${files[@]}"
